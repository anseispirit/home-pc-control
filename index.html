<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home PC Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #ffffff;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .panel {
            background: #181c25;
            border: 1px solid #292f3b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .connection-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #363d4a;
            background: #0f1117;
            color: white;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status-line {
            margin-top: 15px;
            font-weight: bold;
        }

        .offline {
            color: #ef4444;
        }

        .online {
            color: #22c55e;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .card {
            background: #11151d;
            border: 1px solid #292f3b;
            border-radius: 10px;
            padding: 18px;
        }

        .card-title {
            color: #9ca3af;
            font-size: 14px;
        }

        .card-value {
            font-size: 28px;
            margin-top: 8px;
            font-weight: bold;
        }

        #output {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #363d4a;
            background: #0b0e13;
            color: #d1d5db;
            font-family: monospace;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Home PC Control</h1>

    <div class="subtitle">
        Remote control dashboard
    </div>


    <!-- CONNECTION -->

    <div class="panel">

        <h2>Connection</h2>

        <div class="connection-row">

            <input
                id="serverUrl"
                type="text"
                value="https://democrats-arrangement-newer-cleanup.trycloudflare.com"
                placeholder="Cloudflare Tunnel URL"
            >

            <input
                id="token"
                type="password"
                placeholder="PC control token"
            >

            <button onclick="connectToPC()">
                Connect
            </button>

        </div>

        <div id="connectionStatus" class="status-line offline">
            ● Disconnected
        </div>

    </div>


    <!-- SYSTEM STATUS -->

    <div class="panel">

        <h2>System Status</h2>

        <div class="cards">

            <div class="card">
                <div class="card-title">Computer</div>
                <div id="computer" class="card-value">—</div>
            </div>

            <div class="card">
                <div class="card-title">CPU</div>
                <div id="cpu" class="card-value">—</div>
            </div>

            <div class="card">
                <div class="card-title">RAM</div>
                <div id="ram" class="card-value">—</div>
            </div>

            <div class="card">
                <div class="card-title">Disk</div>
                <div id="disk" class="card-value">—</div>
            </div>

        </div>

        <br>

        <button onclick="requestStatus()">
            Refresh Status
        </button>

    </div>


    <!-- OUTPUT -->

    <div class="panel">

        <h2>Connection Output</h2>

        <textarea
            id="output"
            readonly
            placeholder="Messages from your PC will appear here..."
        ></textarea>

    </div>

</div>


<script>

let websocket = null;


// --------------------------------------------------
// CONNECT TO PC
// --------------------------------------------------

function connectToPC() {

    const serverUrl =
        document.getElementById("serverUrl").value.trim();

    const token =
        document.getElementById("token").value.trim();


    if (!serverUrl) {
        alert("Enter the Cloudflare Tunnel address.");
        return;
    }

    if (!token) {
        alert("Enter your PC control token.");
        return;
    }


    // Convert:
    // https://example.trycloudflare.com
    //
    // into:
    // wss://example.trycloudflare.com

    const websocketUrl =
        serverUrl.replace(/^https:/, "wss:").replace(/\/$/, "")
        + "/ws?token="
        + encodeURIComponent(token);


    setConnectionStatus("Connecting...", false);


    try {

        websocket = new WebSocket(websocketUrl);


        websocket.onopen = function() {

            setConnectionStatus("Connected", true);

            addOutput("WebSocket connected.");

        };


        websocket.onmessage = function(event) {

            addOutput("PC: " + event.data);

            try {

                const data = JSON.parse(event.data);

                if (data.type === "status") {

                    updateStatus(data);

                }

            } catch (error) {

                console.log("Received non-JSON message.");

            }

        };


        websocket.onerror = function() {

            addOutput("WebSocket error.");

            setConnectionStatus("Connection error", false);

        };


        websocket.onclose = function() {

            addOutput("WebSocket disconnected.");

            setConnectionStatus("Disconnected", false);

        };

    } catch (error) {

        addOutput("Connection failed: " + error);

        setConnectionStatus("Connection failed", false);

    }

}


// --------------------------------------------------
// REQUEST STATUS
// --------------------------------------------------

function requestStatus() {

    if (!websocket ||
        websocket.readyState !== WebSocket.OPEN) {

        alert("Connect to your PC first.");
        return;
    }


    websocket.send(
        JSON.stringify({
            action: "status"
        })
    );

}


// --------------------------------------------------
// UPDATE STATUS CARDS
// --------------------------------------------------

function updateStatus(data) {

    document.getElementById("computer").textContent =
        data.computer || "—";

    document.getElementById("cpu").textContent =
        data.cpu !== undefined
            ? data.cpu + "%"
            : "—";

    document.getElementById("ram").textContent =
        data.ram !== undefined
            ? data.ram + "%"
            : "—";

    document.getElementById("disk").textContent =
        data.disk !== undefined
            ? data.disk + "%"
            : "—";

}


// --------------------------------------------------
// CONNECTION INDICATOR
// --------------------------------------------------

function setConnectionStatus(message, connected) {

    const element =
        document.getElementById("connectionStatus");

    element.textContent =
        connected
            ? "● " + message
            : "● " + message;

    element.className =
        connected
            ? "status-line online"
            : "status-line offline";

}


// --------------------------------------------------
// OUTPUT LOG
// --------------------------------------------------

function addOutput(message) {

    const output =
        document.getElementById("output");

    const timestamp =
        new Date().toLocaleTimeString();

    output.value +=
        "[" + timestamp + "] " + message + "\n";

    output.scrollTop = output.scrollHeight;

}

</script>

</body>
</html>
