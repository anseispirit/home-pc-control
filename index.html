<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Home PC Remote Desktop</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #080a0f;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#topbar {

    height: 55px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 12px;

    background: #151922;

    border-bottom: 1px solid #2a3040;
}

#serverUrl {

    flex: 1;

    min-width: 200px;

    background: #0b0e14;

    color: white;

    border: 1px solid #303747;

    border-radius: 6px;

    padding: 9px;

}

#token {

    width: 230px;

    background: #0b0e14;

    color: white;

    border: 1px solid #303747;

    border-radius: 6px;

    padding: 9px;

}

button {

    background: #2563eb;

    color: white;

    border: none;

    border-radius: 6px;

    padding: 9px 14px;

    cursor: pointer;

}

button:hover {

    background: #1d4ed8;

}

#status {

    font-size: 13px;

    white-space: nowrap;

}

.disconnected {

    color: #ef4444;

}

.connected {

    color: #22c55e;

}

#viewer {

    width: 100vw;

    height: calc(100vh - 55px);

    display: flex;

    justify-content: center;

    align-items: center;

    background: #000;

    overflow: hidden;

}

#screen {

    display: block;

    max-width: 100%;

    max-height: 100%;

    width: auto;

    height: auto;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    cursor: default;

}

#message {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    color: #9ca3af;

    font-size: 18px;

    text-align: center;

}

@media (max-width: 700px) {

    #token {

        width: 150px;

    }

    #serverUrl {

        display: none;

    }

}

</style>

</head>


<body>


<div id="topbar">

    <input
        id="serverUrl"
        type="text"
        value="https://democrats-arrangement-newer-cleanup.trycloudflare.com"
        placeholder="Cloudflare URL"
    >

    <input
        id="token"
        type="password"
        placeholder="PC token"
    >

    <button onclick="connect()">
        Connect
    </button>

    <button onclick="disconnect()">
        Disconnect
    </button>

    <span
        id="status"
        class="disconnected"
    >
        ● Disconnected
    </span>

</div>


<div id="viewer">

    <div id="message">
        Enter your token and click Connect.
    </div>

    <img
        id="screen"
        draggable="false"
    >

</div>


<script>


let socket = null;

let screenWidth = 1;

let screenHeight = 1;

let lastMouseSend = 0;


// --------------------------------------------------
// CONNECT
// --------------------------------------------------

function connect() {

    const server =
        document
            .getElementById("serverUrl")
            .value
            .trim();

    const token =
        document
            .getElementById("token")
            .value
            .trim();


    if (!server) {

        alert("Enter the Cloudflare URL.");

        return;
    }


    if (!token) {

        alert("Enter your PC token.");

        return;
    }


    disconnect();


    const wsUrl =
        server
            .replace(/^https:/, "wss:")
            .replace(/\/$/, "")
        + "/ws?token="
        + encodeURIComponent(token);


    setStatus(
        "Connecting...",
        false
    );


    socket = new WebSocket(wsUrl);


    // Receive both JSON and binary JPEG frames.
    socket.binaryType = "blob";


    socket.onopen = function() {

        setStatus(
            "Connected",
            true
        );

        document
            .getElementById("message")
            .style.display = "none";

    };


    socket.onmessage = function(event) {


        // JSON message
        if (typeof event.data === "string") {

            try {

                const data =
                    JSON.parse(event.data);


                if (
                    data.type ===
                    "screen_info"
                ) {

                    screenWidth =
                        data.width;

                    screenHeight =
                        data.height;

                }

            }
            catch (error) {

                console.log(error);

            }

            return;
        }


        // JPEG image
        const blob = event.data;


        const url =
            URL.createObjectURL(blob);


        const image =
            document.getElementById("screen");


        const old =
            image.src;


        image.src = url;


        if (old &&
            old.startsWith("blob:")
        ) {

            URL.revokeObjectURL(old);

        }

    };


    socket.onerror = function() {

        setStatus(
            "Connection error",
            false
        );

    };


    socket.onclose = function() {

        setStatus(
            "Disconnected",
            false
        );

        document
            .getElementById("message")
            .style.display = "block";

        document
            .getElementById("message")
            .textContent =
            "Disconnected from PC.";

    };

}


// --------------------------------------------------
// DISCONNECT
// --------------------------------------------------

function disconnect() {

    if (socket) {

        socket.close();

        socket = null;

    }

}


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(
    message,
    connected
) {

    const element =
        document.getElementById("status");


    element.textContent =
        "● " + message;


    element.className =
        connected
            ? "connected"
            : "disconnected";

}


// --------------------------------------------------
// SEND JSON
// --------------------------------------------------

function send(data) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        return;

    }


    socket.send(
        JSON.stringify(data)
    );

}


// --------------------------------------------------
// MOUSE POSITION
// --------------------------------------------------

function getMousePosition(event) {

    const image =
        document.getElementById("screen");


    const rect =
        image.getBoundingClientRect();


    if (
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom
    ) {

        return null;

    }


    const x =
        (event.clientX - rect.left)
        * screenWidth
        / rect.width;


    const y =
        (event.clientY - rect.top)
        * screenHeight
        / rect.height;


    return {
        x: Math.round(x),
        y: Math.round(y)
    };

}


// --------------------------------------------------
// MOUSE MOVE
// --------------------------------------------------

document
    .getElementById("screen")
    .addEventListener(
        "mousemove",
        function(event) {

            const now =
                Date.now();


            // Don't flood the connection.
            if (
                now - lastMouseSend < 25
            ) {

                return;

            }


            lastMouseSend = now;


            const position =
                getMousePosition(event);


            if (!position) {

                return;

            }


            send({

                action: "mouse_move",

                x: position.x,

                y: position.y,

                screen_width:
                    screenWidth,

                screen_height:
                    screenHeight

            });

        }
    );


// --------------------------------------------------
// MOUSE DOWN
// --------------------------------------------------

document
    .getElementById("screen")
    .addEventListener(
        "mousedown",
        function(event) {

            event.preventDefault();


            const position =
                getMousePosition(event);


            if (!position) {

                return;

            }


            let button =
                "left";


            if (event.button === 1) {

                button = "middle";

            }

            else if (event.button === 2) {

                button = "right";

            }


            send({

                action: "mouse_down",

                x: position.x,

                y: position.y,

                button: button,

                screen_width:
                    screenWidth,

                screen_height:
                    screenHeight

            });

        }
    );


// --------------------------------------------------
// MOUSE UP
// --------------------------------------------------

document
    .getElementById("screen")
    .addEventListener(
        "mouseup",
        function(event) {

            event.preventDefault();


            let button =
                "left";


            if (event.button === 1) {

                button = "middle";

            }

            else if (event.button === 2) {

                button = "right";

            }


            send({

                action: "mouse_up",

                button: button

            });

        }
    );


// --------------------------------------------------
// DOUBLE CLICK
// --------------------------------------------------

document
    .getElementById("screen")
    .addEventListener(
        "dblclick",
        function(event) {

            event.preventDefault();


            const position =
                getMousePosition(event);


            if (!position) {

                return;

            }


            send({

                action:
                    "double_click",

                x: position.x,

                y: position.y,

                screen_width:
                    screenWidth,

                screen_height:
                    screenHeight

            });

        }
    );


// --------------------------------------------------
// RIGHT CLICK
// --------------------------------------------------

document
    .getElementById("screen")
    .addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );


// --------------------------------------------------
// SCROLL
// --------------------------------------------------

document
    .getElementById("screen")
    .addEventListener(
        "wheel",
        function(event) {

            event.preventDefault();


            const amount =
                Math.round(
                    -event.deltaY / 100
                );


            send({

                action: "scroll",

                amount:
                    Math.max(
                        -10,
                        Math.min(
                            10,
                            amount
                        )
                    )

            });

        },
        {
            passive: false
        }
    );


// --------------------------------------------------
// KEYBOARD
// --------------------------------------------------

document.addEventListener(
    "keydown",
    function(event) {

        // Don't intercept keys while typing
        // into the connection fields.
        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        event.preventDefault();


        send({

            action: "key_down",

            key: event.key

        });

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        event.preventDefault();


        send({

            action: "key_up",

            key: event.key

        });

    }
);


</script>

</body>

</html>
