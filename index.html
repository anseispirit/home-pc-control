<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home PC Remote Desktop</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #080a0f;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#topbar {
    height: 55px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #151922;
    border-bottom: 1px solid #2a3040;
}

#serverUrl {
    flex: 1;
    min-width: 200px;
    background: #0b0e14;
    color: white;
    border: 1px solid #303747;
    border-radius: 6px;
    padding: 9px;
}

#token {
    width: 230px;
    background: #0b0e14;
    color: white;
    border: 1px solid #303747;
    border-radius: 6px;
    padding: 9px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#status {
    font-size: 13px;
    white-space: nowrap;
}

.disconnected {
    color: #ef4444;
}

.connected {
    color: #22c55e;
}

#viewer {
    width: 100vw;
    height: calc(100vh - 55px);
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
}

#screen {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    cursor: default;
}

#message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #9ca3af;
    font-size: 18px;
    text-align: center;
}

@media (max-width: 700px) {

    #token {
        width: 150px;
    }

    #serverUrl {
        display: none;
    }

}

</style>

</head>


<body>

<div id="topbar">

    <input
        id="serverUrl"
        type="text"
        value="https://democrats-arrangement-newer-cleanup.trycloudflare.com"
        placeholder="Cloudflare URL"
    >

    <input
        id="token"
        type="password"
        placeholder="PC token"
    >

    <button onclick="connect()">Connect</button>

    <button onclick="disconnect()">Disconnect</button>

    <span id="status" class="disconnected">● Disconnected</span>

</div>


<div id="viewer">

    <div id="message">Enter your token and click Connect.</div>

    <img id="screen" draggable="false">

</div>


<script>

let socket = null;

// Real size of the PC screen (sent by the server in "screen_info").
// Mouse positions are measured in this space.
let screenWidth = 1;
let screenHeight = 1;

let lastMouseSend = 0;

// Keys currently held down, so they can be released if the
// browser window loses focus.
const heldKeys = new Set();

const screenEl = document.getElementById("screen");


// --------------------------------------------------
// CONNECT
// --------------------------------------------------

function connect() {

    const server = document.getElementById("serverUrl").value.trim();
    const token = document.getElementById("token").value.trim();

    if (!server) {
        alert("Enter the Cloudflare URL.");
        return;
    }

    if (!token) {
        alert("Enter your PC token.");
        return;
    }

    disconnect();

    const wsUrl =
        server
            .replace(/^https:/, "wss:")
            .replace(/^http:/, "ws:")
            .replace(/\/$/, "")
        + "/ws?token="
        + encodeURIComponent(token);

    setStatus("Connecting...", false);

    const thisSocket = new WebSocket(wsUrl);

    socket = thisSocket;

    thisSocket.binaryType = "blob";


    thisSocket.onopen = function () {

        setStatus("Connected", true);

        document.getElementById("message").style.display = "none";

    };


    thisSocket.onmessage = function (event) {

        // JSON message
        if (typeof event.data === "string") {

            try {

                const data = JSON.parse(event.data);

                if (data.type === "screen_info") {

                    // The server sends screen_width / screen_height.
                    screenWidth = data.screen_width || screenWidth;
                    screenHeight = data.screen_height || screenHeight;

                }

            } catch (error) {

                console.log(error);

            }

            return;
        }

        // JPEG frame
        const url = URL.createObjectURL(event.data);

        const old = screenEl.src;

        screenEl.src = url;

        if (old && old.startsWith("blob:")) {
            URL.revokeObjectURL(old);
        }

    };


    thisSocket.onerror = function () {

        if (socket === thisSocket) {
            setStatus("Connection error", false);
        }

    };


    thisSocket.onclose = function () {

        // Ignore the close of an old socket after reconnecting.
        if (socket !== thisSocket) {
            return;
        }

        socket = null;

        setStatus("Disconnected", false);

        const message = document.getElementById("message");

        message.style.display = "block";
        message.textContent = "Disconnected from PC.";

    };

}


// --------------------------------------------------
// DISCONNECT
// --------------------------------------------------

function disconnect() {

    if (socket) {

        const old = socket;

        socket = null;

        old.close();

    }

}


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(message, connected) {

    const element = document.getElementById("status");

    element.textContent = "● " + message;

    element.className = connected ? "connected" : "disconnected";

}


// --------------------------------------------------
// SEND JSON
// --------------------------------------------------

function send(data) {

    if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
    }

    // The server routes messages by "type".
    if (!data.type) {

        data.type = data.action.startsWith("key_")
            ? "keyboard"
            : "mouse";

    }

    socket.send(JSON.stringify(data));

}


// --------------------------------------------------
// MOUSE HELPERS
// --------------------------------------------------

function getMousePosition(event) {

    const rect = screenEl.getBoundingClientRect();

    if (
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom
    ) {
        return null;
    }

    return {
        x: Math.round((event.clientX - rect.left) * screenWidth / rect.width),
        y: Math.round((event.clientY - rect.top) * screenHeight / rect.height)
    };

}


function buttonName(event) {

    if (event.button === 1) return "middle";
    if (event.button === 2) return "right";

    return "left";

}


// --------------------------------------------------
// MOUSE MOVE
// --------------------------------------------------

screenEl.addEventListener("mousemove", function (event) {

    const now = Date.now();

    // Don't flood the connection.
    if (now - lastMouseSend < 25) {
        return;
    }

    lastMouseSend = now;

    const position = getMousePosition(event);

    if (!position) {
        return;
    }

    send({
        action: "mouse_move",
        x: position.x,
        y: position.y,
        screen_width: screenWidth,
        screen_height: screenHeight
    });

});


// --------------------------------------------------
// MOUSE DOWN
// --------------------------------------------------

screenEl.addEventListener("mousedown", function (event) {

    event.preventDefault();

    const position = getMousePosition(event);

    if (!position) {
        return;
    }

    send({
        action: "mouse_down",
        x: position.x,
        y: position.y,
        button: buttonName(event),
        screen_width: screenWidth,
        screen_height: screenHeight
    });

});


// --------------------------------------------------
// MOUSE UP
//
// Listens on the whole window so the button is still
// released if you let go outside the picture.
// --------------------------------------------------

window.addEventListener("mouseup", function (event) {

    send({
        action: "mouse_up",
        button: buttonName(event)
    });

});


// --------------------------------------------------
// DOUBLE CLICK
//
// Not sent separately: two mouse_down/mouse_up pairs
// already make a double click on the PC. Sending it too
// would click extra times.
// --------------------------------------------------

screenEl.addEventListener("dblclick", function (event) {

    event.preventDefault();

});


// --------------------------------------------------
// RIGHT CLICK MENU
// --------------------------------------------------

screenEl.addEventListener("contextmenu", function (event) {

    event.preventDefault();

});


// --------------------------------------------------
// SCROLL
// --------------------------------------------------

screenEl.addEventListener("wheel", function (event) {

    event.preventDefault();

    // Negative = scroll down, positive = scroll up.
    let amount = Math.round(-event.deltaY / 100);

    if (amount === 0) {
        amount = event.deltaY > 0 ? -1 : 1;
    }

    send({
        action: "scroll",
        amount: Math.max(-10, Math.min(10, amount))
    });

}, { passive: false });


// --------------------------------------------------
// KEYBOARD
// --------------------------------------------------

document.addEventListener("keydown", function (event) {

    // Don't intercept keys while typing in the connection fields.
    if (event.target.tagName === "INPUT") {
        return;
    }

    event.preventDefault();

    heldKeys.add(event.key);

    send({
        action: "key_down",
        key: event.key
    });

});


document.addEventListener("keyup", function (event) {

    if (event.target.tagName === "INPUT") {
        return;
    }

    event.preventDefault();

    heldKeys.delete(event.key);

    send({
        action: "key_up",
        key: event.key
    });

});


// Release held keys if the window loses focus, so nothing sticks.
window.addEventListener("blur", function () {

    heldKeys.forEach(function (key) {

        send({
            action: "key_up",
            key: key
        });

    });

    heldKeys.clear();

});

</script>

</body>

</html>
